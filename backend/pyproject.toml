[project]
name = "powereditor"
version = "0.1.1"
description = "Local automatic video editor backend"
requires-python = ">=3.12"
license = { file = "../LICENSE" }
authors = [{ name = "Nicolás Olmedo" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "rich>=13.7",
    "platformdirs>=4.12.3",
    "keyring>=25.7.0",
    "httpx>=0.28.1",
    "faster-whisper>=1.2.1",
    "numpy>=2.0",
    "rapidfuzz>=3.14.6",
    "jsonschema>=4.23",
    "python-multipart>=0.0.20",
    "websockets>=15",
]

[project.urls]
Homepage = "https://github.com/nikolmedo/PowerEditor"
Repository = "https://github.com/nikolmedo/PowerEditor"
Author = "https://nolmedo.dev"

[project.scripts]
powereditor = "powereditor.cli:app"

[project.optional-dependencies]
vision = [
    "opencv-python-headless>=4.10,<5",
]
embeddings = [
    "sentence-transformers>=6.1.0",
]
nle = [
    "opentimelineio>=0.18.1",
    "otio-fcpx-xml-adapter>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-jsonschema>=4.26.0.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["powereditor"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PTH", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "faster_whisper",
    "faster_whisper.*",
    "ctranslate2",
    "ctranslate2.*",
    "cv2",
    "cv2.*",
    "sentence_transformers",
    "sentence_transformers.*",
    "opentimelineio",
    "opentimelineio.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "ffmpeg: requires ffmpeg and ffprobe on PATH or configured",
    "slow: downloads models or runs heavy inference; run with -m slow",
]
