name: CI

# Runs once per pull request; a merge to main is not re-tested. The release workflow
# checks that CI passed for the tagged commit. `workflow_dispatch` tests a ref by hand,
# e.g. `gh workflow run ci.yml --ref main` before tagging a squash merge.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # The voice rebuild passes filter graphs as script files (`-/filter_complex`),
      # which needs FFmpeg 7.0+; distro packages (Ubuntu 24.04 ships 6.1) are too old.
      - name: Install ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy powereditor tests

      - name: Versions agree with VERSION
        working-directory: ${{ github.workspace }}
        run: uv run --no-project python scripts/version.py check

      - name: JSON Schema is up to date
        run: uv run python -m powereditor.schema_gen --check

      - name: Tests
        run: uv run pytest -q -m "not slow"

  composition:
    # Root scripts run recursively, so typecheck, lint and tests cover both packages.
    name: Composition and web (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Lint
        run: corepack pnpm lint

      - name: Tests
        run: corepack pnpm -r test

      - name: Web build
        run: corepack pnpm --filter @powereditor/web build

      - name: Generated TS types are up to date
        run: corepack pnpm -r check:types

      - name: Prettier
        run: corepack pnpm format:check
